name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test-node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  # Deno 2.9, which runs the Node entry through its Node compatibility: the
  # unit and integration projects under Deno (the runner with -A; the addon
  # built here, so the native QUIC files run, and fail rather than skip when
  # it is missing), then the built package as a consumer installs it, from
  # tarballs (the package, the prebuilt addon for Linux x64 packed as
  # release.yml packs it, and ws), its TCP, WebSocket, raw QUIC and
  # WebTransport round trips run with the permissions a deployment grants
  # (test/runtime/smoke.mjs). What does not run on Deno is written in
  # docs/wiki/Runtimes-and-QUIC.md.
  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - run: npm ci
      - run: npm run build:native
      - name: The unit project on Deno
        run: deno run -A node_modules/vitest/vitest.mjs run --project unit
      - name: The integration project on Deno
        run: deno run -A node_modules/vitest/vitest.mjs run --project integration
        env:
          SWITCHBOARD_NATIVE: required
      - name: The built package on Deno, installed from its tarballs
        run: |
          npm run build
          packages="$RUNNER_TEMP/packages"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$packages" "$consumer"
          cp native/sbq-node.node native/npm/linux-x64-gnu/sbq-node.node
          npm pack --pack-destination "$packages"
          (cd native/npm/linux-x64-gnu && npm pack --pack-destination "$packages")
          cp test/runtime/smoke.mjs "$consumer/"
          cd "$consumer"
          echo '{ "private": true, "type": "module" }' > package.json
          npm install --no-save --no-audit --no-fund "$packages"/*.tgz ws
          deno --version
          deno run --allow-net --allow-read --allow-env --allow-ffi smoke.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --input-type=module -e "import('./dist/core/index.js').then((m) => console.log(Object.keys(m).length, 'exports'))"

  # The Dart reference implementation as a peer (test/interop): the two Dart
  # repositories checked out next to this one at the commits in
  # test/interop/dart_peer/dart_commits.txt, where the peer's path
  # dependencies find them; Dart 3.13.5 and Rust 1.99.0 (switchboard_quic's
  # build hook compiles its QUIC library with cargo) build the AOT peer, which
  # is cached on its sources and the pins. The same Rust toolchain builds this
  # package's native QUIC addon (native/, from the vendored sbq), so the TS
  # peer serves and dials raw QUIC and WebTransport too. The matrix then runs
  # every pairing (Dart and TS, server and client) over TCP, WebSocket, raw
  # QUIC and WebTransport, and the Dart driver (test/interop/dart_driver) runs
  # Dart-written scenarios against the TS peer. The whole matrix then runs a
  # second time with the TS peer on Bun instead of Node
  # (SWITCHBOARD_TS_PEER_RUNTIME). When a toolchain cannot be installed the
  # job warns and the cells needing it skip; otherwise a missing peer or
  # addon fails the run (SWITCHBOARD_INTEROP=required,
  # SWITCHBOARD_NATIVE=required).
  interop:
    name: Interop (Dart reference and TS peer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: switchboard_ts
    steps:
      - uses: actions/checkout@v5
        with:
          path: switchboard_ts

      - name: Pinned Dart commits
        id: pins
        run: |
          pins=test/interop/dart_peer/dart_commits.txt
          echo "core=$(awk '$1 == "switchboard" { print $2 }' "$pins")" >> "$GITHUB_OUTPUT"
          echo "quic=$(awk '$1 == "switchboard_quic" { print $2 }' "$pins")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: kaetemi/switchboard
          ref: ${{ steps.pins.outputs.core }}
          path: switchboard

      - uses: actions/checkout@v5
        with:
          repository: kaetemi/switchboard_quic
          ref: ${{ steps.pins.outputs.quic }}
          path: switchboard_quic

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: switchboard_ts/package-lock.json

      - id: dart
        uses: dart-lang/setup-dart@v1
        continue-on-error: true
        with:
          sdk: 3.13.5

      - id: rust
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outcome == 'success'
        with:
          workspaces: |
            switchboard_quic/native/sbq -> target
            switchboard_ts/native -> target

      - uses: actions/cache@v4
        with:
          path: switchboard_ts/test/interop/dart_peer/build/peer
          key: dart-peer-${{ runner.os }}-${{ hashFiles('switchboard_ts/test/interop/dart_peer/**/*.dart', 'switchboard_ts/test/interop/dart_peer/pubspec.yaml', 'switchboard_ts/test/interop/dart_peer/dart_commits.txt') }}

      - run: npm ci

      - name: Build the Dart peer
        id: peer
        if: steps.dart.outcome == 'success' && steps.rust.outcome == 'success'
        run: node tool/dart-peer.mjs build --expect-pins

      - name: Build the native QUIC addon
        id: addon
        if: steps.rust.outcome == 'success'
        run: npm run build:native

      - name: Interop tests
        run: |
          if [ "${{ steps.peer.outcome }}" = success ]; then
            export SWITCHBOARD_INTEROP=required
          else
            echo "::warning::Dart or Rust could not be installed: the Dart interop cells skip"
            export SWITCHBOARD_INTEROP=skip
          fi
          if [ "${{ steps.addon.outcome }}" = success ]; then
            export SWITCHBOARD_NATIVE=required
          else
            echo "::warning::the native QUIC addon could not be built: the TS cells over raw QUIC and WebTransport skip"
          fi
          npm run test:interop

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Interop tests, the TS peer on Bun
        if: steps.peer.outcome == 'success' && steps.addon.outcome == 'success'
        run: npm run test:interop
        env:
          SWITCHBOARD_INTEROP: required
          SWITCHBOARD_NATIVE: required
          SWITCHBOARD_TS_PEER_RUNTIME: bun

      - name: Dart driver against the TS peer
        if: steps.peer.outcome == 'success'
        run: |
          if [ "${{ steps.addon.outcome }}" != success ]; then
            echo "::warning::no native QUIC addon: the driver's QUIC and WebTransport groups skip"
          fi
          node tool/dart-peer.mjs driver

  # The QUIC thread's jobs: the native addon built from the vendored sbq
  # (checked against switchboard_quic at the pin) and its tests over loopback.
  native:
    name: Native QUIC provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The commit native/sbq-vendor.commit pins: the vendored shim must match it.
      - uses: actions/checkout@v5
        with:
          repository: kaetemi/switchboard_quic
          ref: c5b32652cdcfe91e496fe853b7dcb3a354325bbe
          path: switchboard_quic
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tool/sync-sbq.mjs --check switchboard_quic
      - run: npm run build:native
      - run: npx vitest run --project integration test/integration/quic-native.test.ts test/integration/quic-binding-native.test.ts test/integration/quic-node-native.test.ts test/integration/node-quic.test.ts test/integration/node-webtransport.test.ts test/integration/identity.test.ts
        env:
          SWITCHBOARD_NATIVE: required

  # The web provider in a browser: Playwright's Chromium and Firefox, one
  # test project each, against native WebTransport listeners in the test
  # process (the addon built as in the native job), the page served by Vite
  # (test/browser).
  browser:
    name: Browser (WebTransport in Chromium and Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The commit native/sbq-vendor.commit pins: the vendored shim must match it.
      - uses: actions/checkout@v5
        with:
          repository: kaetemi/switchboard_quic
          ref: c5b32652cdcfe91e496fe853b7dcb3a354325bbe
          path: switchboard_quic
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tool/sync-sbq.mjs --check switchboard_quic
      - run: npm run build:native
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
        env:
          SWITCHBOARD_BROWSER: required

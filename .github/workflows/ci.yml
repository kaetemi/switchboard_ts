name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test-node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --input-type=module -e "import('./dist/core/index.js').then((m) => console.log(Object.keys(m).length, 'exports'))"

  # The interop job (Dart 3.13.5, Rust 1.99.0, the pinned Dart checkouts, the
  # AOT peer) is added by the interop thread; the native and browser jobs by
  # the QUIC thread. See docs/work-split.md.

  native:
    name: Native QUIC provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The commit native/sbq-vendor.commit pins: the vendored shim must match it.
      - uses: actions/checkout@v5
        with:
          repository: kaetemi/switchboard_quic
          ref: c5b32652cdcfe91e496fe853b7dcb3a354325bbe
          path: switchboard_quic
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tool/sync-sbq.mjs --check switchboard_quic
      - run: npm run build:native
      - run: npx vitest run --project integration test/integration/quic-native.test.ts test/integration/quic-binding-native.test.ts
        env:
          SWITCHBOARD_NATIVE: required

# Polyverse Switchboard
# Microservice Network Architecture
# Copyright (C) 2018-2026  Jan BOON (Kaetemi)
#
# The Dart reference implementation as a test peer for the interop tests
# (test/interop/README.md). The path dependencies are sibling checkouts of
# kaetemi/switchboard and kaetemi/switchboard_quic, at the commits in
# dart_commits.txt; tool/dart-peer.mjs writes a pubspec_overrides.yaml when
# they live elsewhere. Built with `dart build cli` to an AOT executable.
name: switchboard_dart_peer
description: The Dart Switchboard as a JSON-lines test peer for switchboard_ts.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  logging: ^1.3.0
  switchboard:
    path: ../../../../switchboard
  switchboard_quic:
    path: ../../../../switchboard_quic
